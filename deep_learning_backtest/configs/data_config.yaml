# ============================================================
# Data Configuration — LSTM + DQN Backtest Suite
# ============================================================

# ---- Primary Data Source ----
primary_source: stooq           # Options: yfinance | alpha_vantage | ccxt | nsepy | stooq

# ---- Symbols to Trade ----
symbols:
  equities:
    - AAPL      # Apple — high liquidity, strong momentum
    - MSFT      # Microsoft — mega-cap, low noise
    - GOOGL     # Alphabet — volatile tech
    - SPY       # S&P 500 ETF — benchmark
    - QQQ       # NASDAQ 100 ETF
    - TSLA      # High-volatility momentum stock
    - AMZN      # Amazon — e-commerce giant
    - NVDA      # Nvidia — semiconductor growth
    - META      # Meta — social media
  crypto:
    - BTC-USD   # Bitcoin
    - ETH-USD   # Ethereum
  india_nse:
    - RELIANCE.NS
    - TCS.NS
    - ^NSEI      # Nifty 50 Index (Yahoo Finance)

# ---- Time Range ----
train_start: "2000-01-01"
train_end:   "2023-12-31"
test_start:  "2024-01-01"
test_end:    "2026-05-31"

# ---- Timeframe / Interval ----
interval: "1d"        # Options: 1m,5m,15m,30m,1h,1d,1wk,1mo
                      # Note: intraday data limited to 60-730 days on yfinance

# ---- Feature Engineering Pipeline ----
features:
  price_features:
    - open
    - high
    - low
    - close
    - volume
  technical_indicators:
    - rsi_14
    - rsi_7
    - macd
    - macd_signal
    - macd_hist
    - bb_upper
    - bb_middle
    - bb_lower
    - bb_bandwidth
    - atr_14
    - atr_7
    - ema_9
    - ema_21
    - ema_50
    - ema_200
    - sma_20
    - obv
    - vwap
    - stoch_k
    - stoch_d
    - adx
    - cci_20
    - mfi_14
    - williams_r
  derived_features:
    - log_return
    - rolling_volatility_20
    - rolling_volatility_60
    - price_to_ema50_ratio
    - volume_ratio_20
    - high_low_spread

# ---- Data Sources Reference ----
# 
# FREE SOURCES (no API key required):
#   yfinance     — Yahoo Finance. Best for daily equities & crypto. Easy setup.
#   stooq        — Global equities, ETFs, indices. Good quality.
#   pandas_datareader (FRED) — Macro data (rates, CPI, GDP).
#
# FREE SOURCES (API key required, free tier):
#   alpha_vantage — 25 API calls/day free. Reliable OHLCV + fundamentals.
#   ccxt          — Crypto OHLCV from 100+ exchanges (Binance, Bybit, etc.)
#   quandl/NASDAQ — Some datasets free, premium for others.
#
# PREMIUM / INSTITUTIONAL:
#   polygon.io    — Tick-level US equities, options, crypto. $29/month+.
#   firstrate_data — Clean intraday data. CSVs available.
#   kibot         — Intraday futures & stocks. Subscription.
#   zerodha_kite  — NSE/BSE India live + historical. Requires broker account.
#
# RESEARCH / BENCHMARK DATASETS:
#   Kaggle — Many pre-built OHLCV datasets: S&P500, Nifty50, crypto
#   UCI ML Repository — Historical stock data sets
#   Synthetic via OU Process / GBM — For testing RL environments
